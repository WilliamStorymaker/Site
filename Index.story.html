<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryFlow - Minha Agenda</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            padding-top: 60px; /* Dá espaço para o menu fixo no topo */
        }

        .highlight {
            color: #d4ad4b;
        }

        /* Menu de Navegação Fixo */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #161616;
            border-bottom: 1px solid #222222;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            z-index: 1000;
        }

        .navbar .nav-logo {
            font-size: 1.1rem;
            font-weight: 700;
            color: #d4ad4b;
            letter-spacing: 1px;
        }

        .nav-menu {
            display: flex;
            gap: 15px;
        }

        .nav-menu a {
            color: #a0a0a0;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-menu a:hover {
            color: #d4ad4b;
        }

        /* Cabeçalho Principal */
        .hero {
            text-align: center;
            padding: 40px 20px 20px 20px;
            background: linear-gradient(180deg, #161616 0%, #0b0b0b 100%);
        }

        .hero h1 {
            font-size: 2rem;
            font-weight: 700;
            max-width: 600px;
            margin: 0 auto 10px auto;
            line-height: 1.3;
        }

        .hero p {
            color: #a0a0a0;
            font-size: 0.9rem;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Seções */
        section {
            padding: 25px 20px;
            max-width: 500px;
            margin: 0 auto;
            scroll-margin-top: 70px; /* Evita que o menu tampe o título ao rolar */
        }

        section h2 {
            font-size: 1.3rem;
            color: #d4ad4b;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* Form / Containers */
        .form-container, .list-container {
            background-color: #161616;
            border: 1px solid #222222;
            padding: 24px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            width: 100%;
            background-color: #0b0b0b;
            border: 1px solid #333333;
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #d4ad4b;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        /* Botões */
        .btn-primary {
            background-color: #d4ad4b;
            color: #000000;
            border: none;
            padding: 14px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            display: block;
            transition: background 0.2s ease;
            text-align: center;
            text-decoration: none;
        }

        .btn-primary:hover {
            background-color: #bfa043;
        }

        .btn-danger {
            background-color: transparent;
            color: #ff4444;
            border: 1px solid #ff4444;
            padding: 12px 12px;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: all 0.2s;
        }

        .btn-danger:hover {
            background-color: rgba(255, 68, 68, 0.1);
        }

        /* Cards da Agenda */
        .card {
            background-color: #0b0b0b;
            border: 1px solid #222222;
            border-left: 4px solid #d4ad4b;
            padding: 16px;
            border-radius: 8px;
            text-align: left;
            position: relative;
        }

        .card h3 {
            color: #d4ad4b;
            font-size: 1.05rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .card p {
            color: #cccccc;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .btn-deletar-card {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-deletar-card:hover {
            color: #ff4444;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 0.75rem;
            color: #555555;
            border-top: 1px solid #161616;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">STORYFLOW</div>
        <div class="nav-menu">
            <a href="#form">＋ Agendar</a>
            <a href="#cronograma">📅 Cronograma</a>
        </div>
    </nav>

    <header class="hero">
        <h1>Painel de <span class="highlight">Agendamentos</span></h1>
        <p>Sua central privada para organizar locais, datas e produções.</p>
    </header>

    <section id="form">
        <h2>Agendar Nova Gravação</h2>
        <div class="form-container">
            <input type="text" id="titulo" placeholder="Nome do Cliente / Gravação">
            <input type="text" id="telefone" placeholder="WhatsApp do Cliente">
            <input type="text" id="local" placeholder="Local da Gravação">
            <div class="form-row">
                <input type="date" id="data">
                <input type="time" id="hora">
            </div>
            <button onclick="adicionarAgenda()" class="btn-primary">Salvar na Agenda</button>
        </div>
    </section>

    <section id="cronograma">
        <h2>Cronograma de Produções</h2>
        <div id="listaAgenda" class="list-container">
            </div>
        <button onclick="limparTodaAgenda()" class="btn-danger">Limpar Toda a Agenda</button>
    </section>

    <footer>
        <p>&copy; 2026 StoryFlow - Gestão Profissional de Conteúdo</p>
    </footer>

    <script>
        let agenda = JSON.parse(localStorage.getItem('minha_agenda')) || [];

        document.addEventListener("DOMContentLoaded", function() {
            mostrarAgenda();
        });

        function adicionarAgenda() {
            const titulo = document.getElementById('titulo').value;
            const telefone = document.getElementById('telefone').value;
            const local = document.getElementById('local').value;
            const data = document.getElementById('data').value;
            const hora = document.getElementById('hora').value;

            if (!titulo || !local || !data || !hora) {
                alert('Preencha pelo menos o Nome, Local, Data e Horário!');
                return;
            }

            const novoAgendamento = {
                id: Date.now(),
                titulo: titulo,
                telefone: telefone || 'Não informado',
                local: local,
                data: data,
                hora: hora
            };

            agenda.push(novoAgendamento);
            localStorage.setItem('minha_agenda', JSON.stringify(agenda));

            document.getElementById('titulo').value = '';
            document.getElementById('telefone').value = '';
            document.getElementById('local').value = '';
            document.getElementById('data').value = '';
            document.getElementById('hora').value = '';

            mostrarAgenda();
        }

        function mostrarAgenda() {
            const listaDiv = document.getElementById('listaAgenda');
            
            if (agenda.length === 0) {
                listaDiv.innerHTML = '<p style="color: #666; text-align: center; font-size: 0.9rem; padding: 10px 0;">Nenhuma gravação agendada.</p>';
                return;
            }

            agenda.sort((a, b) => new Date(a.data + 'T' + a.hora) - new Date(b.data + 'T' + b.hora));

            listaDiv.innerHTML = ''; 

            agenda.forEach(item => {
                const dataFormatada = item.data.split('-').reverse().join('/');
                listaDiv.innerHTML += `
                    <div class="card">
                        <button class="btn-deletar-card" onclick="deletarItem(${item.id})">✕</button>
                        <h3>${item.titulo}</h3>
                        <p><strong>📍 Local:</strong> ${item.local}</p>
                        <p><strong>📅 Data/Hora:</strong> ${dataFormatada} às ${item.hora}</p>
                        <p><strong>📞 Contato:</strong> ${item.telefone}</p>
                    </div>
                `;
            });
        }

        function deletarItem(id) {
            agenda = agenda.filter(item => item.id !== id);
            localStorage.setItem('minha_agenda', JSON.stringify(agenda));
            mostrarAgenda();
        }

        function limparTodaAgenda() {
            if (confirm('Deseja apagar todos os agendamentos da lista?')) {
                agenda = [];
                localStorage.removeItem('minha_agenda');
                mostrarAgenda();
            }
        }
    </script>
</body>
</html>
